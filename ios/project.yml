# XcodeGen spec. Generate the Xcode project with:
#   brew install xcodegen
#   cd ios && xcodegen generate
#   open GlobalFundExplorer.xcodeproj
name: GlobalFundExplorer
options:
  bundleIdPrefix: org.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  GlobalFundExplorer:
    type: application
    platform: iOS
    sources:
      - GlobalFundExplorer
    info:
      path: GlobalFundExplorer/Info.plist
      properties:
        CFBundleDisplayName: GF Explorer
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.GlobalFundExplorer
        TARGETED_DEVICE_FAMILY: "1,2"
        # Set your team in Xcode (Signing & Capabilities) or here.
        DEVELOPMENT_TEAM: ""
  GlobalFundExplorerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - GlobalFundExplorerTests
    dependencies:
      - target: GlobalFundExplorer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  GlobalFundExplorer:
    build:
      targets:
        GlobalFundExplorer: all
        GlobalFundExplorerTests: [test]
    test:
      targets:
        - GlobalFundExplorerTests
